# Builds automáticas (docs/PROGRAMACAO.md, secção 11): testes e exportação para Windows, Linux, Web e Android.
# Corre em cada push para main e nas tags v*; nas tags os ficheiros ficam numa Release.
name: builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSAO: 4.4.1

jobs:
  testes:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Importar
        run: godot --headless --import --path . || true
      - name: Testes
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json

  exportar:
    needs: testes
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows
            pasta: windows
          - preset: Linux
            pasta: linux
          - preset: Web
            pasta: web
          - preset: Android
            pasta: android
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Templates de exportação no sítio certo
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSAO}.stable ~/.local/share/godot/export_templates/ || true
      - name: Chave de teste para o Android
        if: matrix.preset == 'Android'
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> $GITHUB_ENV
      - name: Importar
        run: godot --headless --import --path . || true
      - name: Exportar ${{ matrix.preset }}
        run: |
          mkdir -p build/${{ matrix.pasta }}
          godot --headless --path . --export-release "${{ matrix.preset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: a-torre-${{ matrix.pasta }}
          path: build/${{ matrix.pasta }}

  lancar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: exportar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build
      - name: Zips
        run: cd build && for d in */; do zip -qr "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip

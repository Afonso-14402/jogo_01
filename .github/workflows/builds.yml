# Builds automáticas (docs/PROGRAMACAO.md, secção 11): testes e exportação para Windows, Linux, Web e Android.
# Corre em cada push para main, nas tags v* (os ficheiros ficam numa Release) e à mão (workflow_dispatch).
#
# O projeto tem ~26 000 ficheiros de arte e ~1100 peças .glb: importar tudo gasta muita memória. Por isso:
#  - cada máquina ganha 12 GB de memória de troca (swap) antes de correr o Godot;
#  - a pasta .godot (as importações) fica em cache e passa dos testes para as exportações;
#  - o Godot corre na imagem barichello/godot-ci com "docker run" (assim a máquina pode ter swap).
name: builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_IMAGEM: barichello/godot-ci:4.4.1

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mais memória (swap)
        run: |
          sudo fallocate -l 12G /swap_godot && sudo chmod 600 /swap_godot && sudo mkswap /swap_godot && sudo swapon /swap_godot
          free -h
      - name: Importações em cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-importar-${{ hashFiles('project.godot', 'arte/**', 'musica/**', 'sons/**') }}
          restore-keys: godot-importar-
      - name: Importar
        run: docker run --rm -v "$PWD":/jogo -w /jogo $GODOT_IMAGEM godot --headless --import --path . > importar.log 2>&1 || (tail -40 importar.log; true)
      - name: Testes
        run: docker run --rm -v "$PWD":/jogo -w /jogo $GODOT_IMAGEM godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json
      - name: Dar as importações aos outros passos
        run: sudo chown -R "$(id -u):$(id -g)" .godot

  exportar:
    needs: testes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows
            pasta: windows
          - preset: Linux
            pasta: linux
          - preset: Web
            pasta: web
          - preset: Android
            pasta: android
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Mais memória (swap)
        run: |
          sudo fallocate -l 12G /swap_godot && sudo chmod 600 /swap_godot && sudo mkswap /swap_godot && sudo swapon /swap_godot
          free -h
      - name: Importações em cache
        uses: actions/cache/restore@v4
        with:
          path: .godot
          key: godot-importar-${{ hashFiles('project.godot', 'arte/**', 'musica/**', 'sons/**') }}
          restore-keys: godot-importar-
      - name: Exportar ${{ matrix.preset }}
        run: |
          mkdir -p build/${{ matrix.pasta }}
          docker run --rm -v "$PWD":/jogo -w /jogo $GODOT_IMAGEM bash -c '
            set -e
            if [ "${{ matrix.preset }}" = "Android" ]; then
              keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey \
                -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/debug.keystore
              export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
              export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
            fi
            godot --headless --import --path . > /tmp/importar.log 2>&1 || true
            godot --headless --path . --export-release "${{ matrix.preset }}"
          '
          ls -la build/${{ matrix.pasta }}
      - uses: actions/upload-artifact@v4
        with:
          name: a-torre-${{ matrix.pasta }}
          path: build/${{ matrix.pasta }}

  lancar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: exportar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build
      - name: Zips
        run: cd build && for d in */; do zip -qr "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
